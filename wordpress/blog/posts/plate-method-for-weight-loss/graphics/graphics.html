<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:IS;font-weight:400;src:url(fonts/instrument-sans-latin-400-normal.woff2)}
@font-face{font-family:IS;font-weight:500;src:url(fonts/instrument-sans-latin-500-normal.woff2)}
@font-face{font-family:IS;font-weight:600;src:url(fonts/instrument-sans-latin-600-normal.woff2)}
@font-face{font-family:IS;font-weight:700;src:url(fonts/instrument-sans-latin-700-normal.woff2)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:IS,sans-serif;color:#101614;background:#F6F5F1;overflow:hidden}
.c{position:relative;display:flex;flex-direction:column}
.brand{font-weight:700;letter-spacing:.16em;font-size:24px;color:#101614}
.brand b{color:#1D5A48;font-weight:700}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 28px;font-weight:600}
.legend>span{display:inline-flex;align-items:center;gap:10px}
.legend i{width:20px;height:20px;border-radius:50%;display:inline-block}
.dot-v{background:#5E9C64}.dot-p{background:#EC8A63}.dot-c{background:#E2B356}
svg{display:block}
.fr{display:inline-flex;align-items:baseline;margin-right:.28em}.fr .n{font-size:.6em;position:relative;top:-.45em}.fr .d{font-size:.6em}.fr .s{margin:0 .03em}
</style></head><body>
<div id="root"></div>
<script>
const F = (n, d) => `<span class="fr"><span class="n">${n}</span><span class="s">/</span><span class="d">${d}</span></span>`;
// Seeded random so every render is identical
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function broccoli(x, y, s) {
  let g = `<g transform="translate(${x},${y}) scale(${s})">`;
  g += `<path d="M-9,10 L-6,46 Q0,52 6,46 L9,10 Z" fill="#A9CB8E"/>`;
  const pts = [[-26,-4,20],[0,-18,24],[26,-4,20],[-14,14,17],[14,14,17],[0,4,18],[-34,14,13],[34,14,13]];
  for (const [a,b,r] of pts) g += `<circle cx="${a}" cy="${b}" r="${r}" fill="#4F8A57"/>`;
  for (const [a,b,r] of pts) g += `<circle cx="${a-r*.25}" cy="${b-r*.3}" r="${r*.55}" fill="#6AA56F"/>`;
  return g + '</g>';
}
function tomato(x, y, r) {
  let g = `<g transform="translate(${x},${y})"><circle r="${r}" fill="#D9472F"/><circle r="${r*.78}" fill="#EE6F55"/>`;
  for (let i = 0; i < 3; i++) { const a = i * 2.094 + .5; g += `<ellipse cx="${Math.cos(a)*r*.38}" cy="${Math.sin(a)*r*.38}" rx="${r*.2}" ry="${r*.12}" transform="rotate(${a*57.3} ${Math.cos(a)*r*.38} ${Math.sin(a)*r*.38})" fill="#F7C9A8"/>`; }
  return g + `<circle r="${r*.12}" fill="#F4A98F"/></g>`;
}
function cucumber(x, y, r) {
  return `<g transform="translate(${x},${y})"><circle r="${r}" fill="#3F7A36"/><circle r="${r*.86}" fill="#A9D08A"/><circle r="${r*.5}" fill="#D7EBC0"/>` +
    [0,1,2,3,4,5].map(i => `<circle cx="${Math.cos(i*1.047)*r*.3}" cy="${Math.sin(i*1.047)*r*.3}" r="${r*.07}" fill="#F3F8E8"/>`).join('') + '</g>';
}
function leaf(x, y, rot, s) {
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})"><path d="M0,-44 C30,-30 30,30 0,44 C-30,30 -30,-30 0,-44 Z" fill="#7DB36A"/><path d="M0,-40 L0,40" stroke="#5E9A50" stroke-width="3" fill="none"/></g>`;
}
function salmon(x, y, rot) {
  let g = `<g transform="translate(${x},${y}) rotate(${rot})">`;
  const body = 'M-92,-30 C-60,-62 52,-66 88,-34 C108,-14 104,26 80,42 C40,64 -50,62 -88,36 C-110,18 -110,-12 -92,-30 Z';
  const id = 'sal' + Math.round(x) + Math.round(y);
  g += `<clipPath id="${id}"><path d="${body}"/></clipPath><path d="${body}" fill="#EE8A60"/><g clip-path="url(#${id})">`;
  g += `<path d="M-86,-24 C-56,-52 50,-56 82,-28" fill="none" stroke="#F6B08F" stroke-width="7" stroke-linecap="round" opacity=".7"/>`;
  for (let i = -3; i <= 3; i++) g += `<path d="M${i*24-10},-48 C${i*24+12},-16 ${i*24+12},16 ${i*24-8},50" fill="none" stroke="#FCD8C6" stroke-width="5" stroke-linecap="round"/>`;
  g += `<path d="M-92,30 C-50,58 40,60 80,40" fill="none" stroke="#D9734B" stroke-width="6" stroke-linecap="round" opacity=".55"/>`;
  return g + '</g></g>';
}
function lemon(x, y, r) {
  let g = `<g transform="translate(${x},${y})"><circle r="${r}" fill="#F2CF4A"/><circle r="${r*.84}" fill="#FBEA9A"/>`;
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; g += `<path d="M0,0 L${Math.cos(a-.3)*r*.74},${Math.sin(a-.3)*r*.74} A${r*.74},${r*.74} 0 0 1 ${Math.cos(a+.3)*r*.74},${Math.sin(a+.3)*r*.74} Z" fill="#F7DC6A"/>`; }
  return g + '</g>';
}
function potato(x, y, rot, s) {
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})"><ellipse rx="40" ry="31" fill="#B98535"/><ellipse rx="35" ry="26" fill="#F1D27E"/><ellipse cx="-6" cy="-5" rx="22" ry="14" fill="#F8E4A6"/><circle cx="12" cy="9" r="2.6" fill="#D9B45C"/><circle cx="-16" cy="12" r="2" fill="#D9B45C"/></g>`;
}
function plate(size, opts = {}) {
  const R = 300, r = 236;
  let s = `<svg width="${size}" height="${size}" viewBox="-330 -330 660 660" xmlns="http://www.w3.org/2000/svg">`;
  s += `<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#101614" flood-opacity=".14"/></filter>
  <clipPath id="veg"><path d="M0,0 L0,-${r} A${r} ${r} 0 0 0 0 ${r} Z"/></clipPath>
  <clipPath id="pro"><path d="M0,0 L0,-${r} A${r} ${r} 0 0 1 ${r} 0 Z"/></clipPath>
  <clipPath id="carb"><path d="M0,0 L${r},0 A${r} ${r} 0 0 1 0 ${r} Z"/></clipPath></defs>`;
  s += `<circle r="${R}" fill="#FFFFFF" filter="url(#sh)"/><circle r="${R-6}" fill="none" stroke="#ECE9E0" stroke-width="2"/><circle r="${r+14}" fill="#F9F8F4"/>`;
  // Vegetables (left half)
  s += `<g clip-path="url(#veg)"><rect x="-${r}" y="-${r}" width="${r}" height="${r*2}" fill="#DCEBDB"/>`;
  s += leaf(-160,-120,-30,1.25) + leaf(-200,40,20,1.1) + leaf(-70,-190,60,1) + leaf(-100,200,-50,1.1) + leaf(-40,40,10,.95);
  s += broccoli(-120,-60,1.35) + broccoli(-150,120,1.2) + broccoli(-55,-150,.95);
  s += tomato(-200,-40,30) + tomato(-60,110,28) + tomato(-40,-40,26) + tomato(-120,190,24);
  s += cucumber(-175,-160,25) + cucumber(-210,110,22) + cucumber(-40,200,22) + cucumber(-95,40,24);
  s += `</g>`;
  // Protein (top right)
  s += `<g clip-path="url(#pro)"><rect x="0" y="-${r}" width="${r}" height="${r}" fill="#F8E1D6"/>` + salmon(118,-104,-38) + lemon(196,-28,26) + leaf(40,-200,70,.7) + `</g>`;
  // Carbs (bottom right)
  s += `<g clip-path="url(#carb)"><rect x="0" y="0" width="${r}" height="${r}" fill="#F5EAD0"/>`;
  s += potato(70,62,15,1) + potato(150,52,-20,.95) + potato(205,118,60,.8) + potato(62,140,-35,.95) + potato(140,130,25,1.05) + potato(98,205,-5,.9) + potato(180,190,40,.75);
  for (let i = 0; i < 16; i++) { const a = rnd()*6.28, d = 60 + rnd()*150; const x = Math.abs(Math.cos(a))*d + 20, y = Math.abs(Math.sin(a))*d + 20; s += `<ellipse cx="${x}" cy="${y}" rx="7" ry="2.4" transform="rotate(${rnd()*180} ${x} ${y})" fill="#3F6F3A"/>`; }
  s += `</g>`;
  s += `<path d="M0,-${r+2} L0,${r+2} M0,0 L${r+2},0" stroke="#F9F8F4" stroke-width="10"/>`;
  if (opts.labels) {
    const chip = (x, y, d, t, c) => { const w = t.length * 15.5 + 76; return `<g transform="translate(${x},${y})"><rect x="${-w/2}" y="-26" width="${w}" height="52" rx="26" fill="#FFFFFF" opacity=".96"/><text text-anchor="middle" y="10" font-family="IS" font-weight="700" font-size="28" fill="${c}"><tspan font-size="17" dy="-10">1</tspan><tspan font-size="20" dy="5">/</tspan><tspan font-size="17" dy="5">${d}</tspan><tspan dy="0" dx="7">${t}</tspan></text></g>`; };
    s += chip(-118, 4, 2, 'Veggies', '#1D5A48') + chip(118, -150, 4, 'Protein', '#B4532F') + chip(118, 150, 4, 'Carbs', '#9A6B14');
  }
  return s + '</svg>';
}
function glass(h) {
  return `<svg width="${h*0.62}" height="${h}" viewBox="0 0 62 100"><path d="M6,4 L56,4 L50,94 Q49,97 46,97 L16,97 Q13,97 12,94 Z" fill="#FFFFFF" stroke="#C9D6DA" stroke-width="2.5"/><path d="M10,30 L52,30 L48,92 L14,92 Z" fill="#CFE6EE"/><path d="M14,36 L18,86" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".8"/></svg>`;
}
const v = new URLSearchParams(location.search).get('v');
const root = document.getElementById('root');
const legend = (fs) => `<div class="legend" style="font-size:${fs}px"><span><i class="dot-v"></i>${F(1,2)}Vegetables</span><span><i class="dot-p"></i>${F(1,4)}Protein</span><span><i class="dot-c"></i>${F(1,4)}Smart carbs</span></div>`;
if (v === 'featured') {
  root.innerHTML = `<div class="c" style="width:1200px;height:1500px;padding:96px 96px 80px;align-items:center;text-align:center">
    <div class="brand">LEAN MODE <b>PRO</b></div>
    <h1 style="margin:44px 0 0;font-size:108px;line-height:1.0;letter-spacing:-.035em;font-weight:600">The Plate Method<br><span style="color:#1D5A48">for Weight Loss</span></h1>
    <p style="margin:30px 0 0;font-size:40px;line-height:1.3;color:#414B46;font-weight:500">Build a filling plate without counting calories</p>
    <div style="margin-top:56px">${plate(760, {labels:true})}</div>
  </div>`;
} else if (v === 'diagram') {
  const row = (dot, title, text) => `<div style="display:flex;gap:22px;align-items:flex-start;margin-bottom:34px"><i class="${dot}" style="flex:0 0 28px;height:28px;border-radius:50%;margin-top:6px"></i><div><div style="font-size:40px;font-weight:700;letter-spacing:-.01em">${title}</div><div style="font-size:28px;line-height:1.35;color:#414B46;margin-top:4px">${text}</div></div></div>`;
  root.innerHTML = `<div class="c" style="width:1600px;height:1000px;flex-direction:row;align-items:center;padding:60px 80px;gap:70px;background:#FFFFFF">
    <div style="position:relative">${plate(820)}<div style="position:absolute;right:-30px;top:40px">${glass(170)}</div></div>
    <div style="flex:1">
      ${row('dot-v',F(1,2)+'Vegetables','Broccoli, salad, peppers, tomatoes, zucchini, green beans')}
      ${row('dot-p',F(1,4)+'Protein','Chicken, fish, eggs, lean beef, Greek yogurt, tofu, beans')}
      ${row('dot-c',F(1,4)+'Smart carbs','Potatoes, rice, oats, whole-grain bread or pasta, fruit')}
      <div style="display:flex;gap:22px;align-items:flex-start"><i style="flex:0 0 28px;height:28px;border-radius:50%;margin-top:6px;background:#F2CF4A"></i><div><div style="font-size:40px;font-weight:700">+ A thumb of healthy fat</div><div style="font-size:28px;line-height:1.35;color:#414B46;margin-top:4px">Olive oil, nuts, avocado. Plus a glass of water.</div></div></div>
    </div></div>`;
} else if (v === 'pin1') {
  root.innerHTML = `<div class="c" style="width:1000px;height:1500px">
    <div style="background:#1D5A48;color:#fff;padding:80px 70px 86px;text-align:center">
      <div style="font-weight:700;letter-spacing:.2em;font-size:26px;color:#BFE0CF">NO CALORIE COUNTING</div>
      <div style="font-size:112px;font-weight:700;line-height:.98;letter-spacing:-.035em;margin-top:26px">The Plate Method</div>
      <div style="font-size:66px;font-weight:600;line-height:1.05;letter-spacing:-.02em;margin-top:10px;color:#F6F5F1">for Weight Loss</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:30px 50px 0">
      ${plate(700, {labels:true})}
      ${legend(34)}
    </div>
    <div style="text-align:center;padding:0 0 56px;font-size:30px;font-weight:600;color:#1D5A48;letter-spacing:.04em">leanmodepro.com</div>
  </div>`;
} else if (v === 'pin2') {
  root.innerHTML = `<div class="c" style="width:1000px;height:1500px;background:#E9F1EA;align-items:center;text-align:center;padding:90px 70px 60px">
    <div style="background:#101614;color:#fff;font-weight:700;font-size:28px;letter-spacing:.12em;padding:14px 28px;border-radius:999px">EASY WEIGHT LOSS RULE</div>
    <div style="font-size:96px;font-weight:700;line-height:1.0;letter-spacing:-.035em;margin-top:40px">Lose Weight<br>Without Counting<br><span style="color:#1D5A48">Calories</span></div>
    <div style="margin-top:44px">${plate(640, {labels:true})}</div>
    <div style="margin-top:auto;font-size:36px;font-weight:600;color:#414B46">Fill your plate like this at every meal</div>
    <div style="margin-top:22px;font-size:28px;font-weight:600;color:#1D5A48;letter-spacing:.04em">leanmodepro.com</div>
  </div>`;
}
</script></body></html>
